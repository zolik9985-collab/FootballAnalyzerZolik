
name: Build Football Analyzer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FootballAnalyzer-New-Project.zip'
      - 'MainActivity.java'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract new project
        run: |
          mkdir -p source
          unzip -q FootballAnalyzer-New-Project.zip -d source

      - name: Apply updated MainActivity
        run: |
          cp MainActivity.java source/FootballAnalyzerNew/app/src/main/java/com/footballanalyzer/app/MainActivity.java

      - name: Build APK
        run: |
          cd source/FootballAnalyzerNew
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballAnalyzer-APK
          path: source/FootballAnalyzerNew/app/build/outputs/apk/debug/app-debug.apk
