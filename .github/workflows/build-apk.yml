name: Build Football Analyzer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FootballAnalyzer-New-Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract new project
        run: |
          rm -rf source
          mkdir source
          unzip -q FootballAnalyzer-New-Project.zip -d source

      - name: Build APK
        run: |
          cd source/FootballAnalyzerNew
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FootballAnalyzer-APK
          path: source/FootballAnalyzerNew/app/build/outputs/apk/debug/app-debug.apk
